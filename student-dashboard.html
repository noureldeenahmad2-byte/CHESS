<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>لوحة الطالب | بريق نور</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f4f7fb;color:#153656}.top{background:linear-gradient(90deg,#07376d,#0a4787);color:#fff;padding:17px 4%;display:flex;justify-content:space-between;gap:12px;align-items:center}.top a{color:#fff;text-decoration:none;font-weight:bold}.wrap{max-width:1050px;margin:28px auto;padding:0 16px}.profile,.results{background:white;border:1px solid #dce6ef;border-radius:16px;padding:22px;margin-bottom:18px;box-shadow:0 8px 24px #17365d0c}.profile h1{margin-top:0;color:#07376d}.muted{color:#64798e;line-height:1.8}.btn{padding:10px 14px;border:0;border-radius:9px;background:#0b5fa5;color:white;font:inherit;font-weight:bold;cursor:pointer}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:580px}th,td{padding:12px;border-bottom:1px solid #e4ebf2;text-align:right}th{background:#f1f6fb;color:#07376d}.empty{text-align:center;padding:24px;color:#64798e}.pill{display:inline-block;padding:5px 9px;background:#e8f6ef;color:#14744b;border-radius:20px;font-weight:bold}@media(max-width:600px){.top{flex-direction:column;text-align:center}.profile,.results{padding:16px}}</style></head><body><header class="top"><a href="/">🎓 بريق نور</a><div><a href="/exams.html">الامتحانات</a>　<button class="btn" id="logout">تسجيل الخروج</button></div></header><main class="wrap"><section class="profile"><h1 id="welcome">لوحة الطالب</h1><p class="muted" id="details">جارٍ تحميل بيانات الحساب...</p><a class="btn" href="/exams.html" style="display:inline-block;text-decoration:none">اذهب إلى الامتحانات</a></section><section class="results"><h2>نتائجي</h2><p class="muted">ستظهر هنا نتائج الامتحانات التي تؤديها أثناء تسجيل الدخول إلى حسابك. النتائج السابقة قبل إنشاء الحساب لن تُنسب إليه تلقائيًا.</p><div class="tablewrap"><table><thead><tr><th>الامتحان</th><th>الصف</th><th>الصحيح</th><th>الخطأ</th><th>الدرجة</th><th>النسبة</th><th>التاريخ</th></tr></thead><tbody id="rows"><tr><td colspan="7" class="empty">جارٍ تحميل النتائج...</td></tr></tbody></table></div></section></main><script>
async function load(){try{const r=await fetch('/api/student/me');if(!r.ok){location.href='/student-login';return}const u=await r.json();document.getElementById('welcome').textContent='أهلًا يا '+u.full_name;document.getElementById('details').textContent='اسم المستخدم: '+u.username+' — الصف الدراسي: '+u.class_name;const rr=await fetch('/api/student/results');if(!rr.ok)throw new Error('تعذر تحميل النتائج');const data=await rr.json();const body=document.getElementById('rows');if(!data.length){body.innerHTML='<tr><td colspan="7" class="empty">لا توجد نتائج مرتبطة بحسابك حتى الآن. ابدأ أحد الامتحانات وأنت مسجّل الدخول.</td></tr>';return}body.innerHTML=data.map(x=>`<tr><td>${esc(x.exam_title)}</td><td>${esc(x.class_name)}</td><td>${x.correct}</td><td>${x.wrong}</td><td>${x.correct} / ${x.total}</td><td><span class="pill">${x.percentage}%</span></td><td>${esc(x.created_at||'')}</td></tr>`).join('')}catch(e){document.getElementById('rows').innerHTML='<tr><td colspan="7" class="empty">حدث خطأ في تحميل بيانات الحساب.</td></tr>'}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}document.getElementById('logout').addEventListener('click',async()=>{await fetch('/api/student/logout',{method:'POST'});location.href='/student-login'});load();
</script></body></html>
