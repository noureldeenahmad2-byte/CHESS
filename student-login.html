<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>حساب الطالب | بريق نور</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(135deg,#edf5ff,#f9f7f0);color:#153656;min-height:100vh}.top{background:linear-gradient(90deg,#07376d,#0a4787);color:white;padding:18px;text-align:center}.top a{color:white;text-decoration:none;font-weight:bold}.wrap{max-width:920px;margin:32px auto;padding:0 16px}.intro{text-align:center;margin-bottom:22px}.intro h1{color:#07376d}.panels{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:white;border:1px solid #dce6ef;border-radius:18px;padding:24px;box-shadow:0 8px 24px #17365d12}.panel h2{margin-top:0;color:#0b477f}label{display:block;margin:13px 0 6px;font-weight:bold;font-size:14px}input,select{width:100%;padding:12px;border:1px solid #cbd7e3;border-radius:10px;font:inherit;background:white}button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:10px;background:#0b5fa5;color:white;font:inherit;font-weight:bold;cursor:pointer}button:hover{filter:brightness(.95)}.msg{margin-top:12px;line-height:1.8;font-size:14px}.note{font-size:12px;color:#65798c;line-height:1.8}@media(max-width:680px){.panels{grid-template-columns:1fr}.wrap{margin:18px auto}.panel{padding:19px}}</style></head><body>
<header class="top"><a href="/">🎓 بريق نور | العودة للرئيسية</a></header><main class="wrap"><div class="intro"><h1>حساب الطالب</h1><p>أنشئ حسابك لمتابعة درجاتك في الامتحانات التي تؤديها وأنت مسجّل الدخول.</p></div><div class="panels">
<section class="panel"><h2>إنشاء حساب جديد</h2><form id="registerForm"><label for="full_name">الاسم الكامل</label><input id="full_name" required minlength="3" autocomplete="name"><label for="new_username">اسم المستخدم</label><input id="new_username" required minlength="4" autocomplete="username"><p class="note">استخدم حروفًا إنجليزية أو أرقامًا أو شرطة سفلية، 4 أحرف على الأقل.</p><label for="new_password">كلمة المرور</label><input id="new_password" type="password" required minlength="8" autocomplete="new-password"><label for="class_id">الصف الدراسي</label><select id="class_id" required><option value="">جارٍ تحميل الصفوف...</option></select><button type="submit">إنشاء الحساب</button><div class="msg" id="registerMsg" role="status"></div></form></section>
<section class="panel"><h2>تسجيل الدخول</h2><form id="loginForm"><label for="username">اسم المستخدم</label><input id="username" required autocomplete="username"><label for="password">كلمة المرور</label><input id="password" type="password" required autocomplete="current-password"><button type="submit">دخول إلى حسابي</button><div class="msg" id="loginMsg" role="status"></div></form><p class="note">لو نسيت كلمة المرور، اطلب من المدرّس مساعدتك. لا تشارك كلمة مرورك مع أي شخص.</p></section></div></main>
<script>
async function loadClasses(){const sel=document.getElementById('class_id');try{const r=await fetch('/api/classes');const data=await r.json();sel.innerHTML='<option value="">اختر صفك الدراسي</option>'+data.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}catch(e){sel.innerHTML='<option value="">تعذر تحميل الصفوف</option>'}}
async function sendForm(url,payload,msgId){const msg=document.getElementById(msgId);msg.textContent='جارٍ التنفيذ...';try{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok)throw new Error(d.error||'حدث خطأ');msg.textContent=d.message||'تم بنجاح';location.href=d.redirect||'/student-dashboard'}catch(e){msg.textContent=e.message}}
document.getElementById('registerForm').addEventListener('submit',e=>{e.preventDefault();sendForm('/api/student/register',{full_name:document.getElementById('full_name').value,username:document.getElementById('new_username').value,password:document.getElementById('new_password').value,class_id:document.getElementById('class_id').value},'registerMsg')});
document.getElementById('loginForm').addEventListener('submit',e=>{e.preventDefault();sendForm('/api/student/login',{username:document.getElementById('username').value,password:document.getElementById('password').value},'loginMsg')});loadClasses();
</script></body></html>
